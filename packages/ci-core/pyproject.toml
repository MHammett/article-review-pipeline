[project]
name = "ci-core"
version = "0.1.0"
description = "Shared library for CI tools"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.14",
    "structlog>=26.1.0",
    "starlette>=1.3.1",
    # ci_core.llm — the shared streaming LLM call layer. Deliberately built on
    # requests + raw SSE rather than the per-provider SDKs: one transport, one
    # set of timeout/encoding/error-body semantics across all six providers.
    "requests>=2.31.0,<3.0",
    "pyyaml>=6.0,<7.0",
    # ci_core.extract — text extraction from PDF citation sources. Many of the
    # primary documents this pipeline verifies against (ICNIRP guidelines, NIOSH
    # reports, EPA rules) are PDFs, so this is required rather than an extra:
    # pypdf is pure Python with no compiled dependencies, and without it every
    # PDF source degrades to unverifiable.
    "pypdf>=4.0",
    # Main-content extraction. Previously an optional extra of ci-article-review
    # (--url mode fell back to a heuristic parser when it was absent), but
    # citation verification now depends on extraction quality for correctness,
    # not just for output polish: on pages with no <article>/<main> the built-in
    # fallback returns nav and footer chrome, and the verifier then reports that
    # a source does not support a claim it was never actually shown. Measured on
    # the failing citation set, trafilatura recovers real body text (e.g. EPA
    # Green Book county tables) where the fallback returns menus. The fallback
    # stays as a safety net.
    "trafilatura>=1.6",
]

[project.optional-dependencies]
# Vertex AI backend for the Gemini adapter (google.auth token flow).
# Not needed when using Gemini via AI Studio (API-key auth).
vertex = ["google-auth>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
