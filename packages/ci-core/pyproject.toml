[project]
name = "ci-core"
version = "0.1.0"
description = "Shared library for CI tools"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.14",
    "structlog>=26.1.0",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.28"]
openai = ["openai>=1.0"]
gemini = ["google-genai>=1.0"]
mistral = ["mistralai>=1.0"]
all-llm = [
    "anthropic>=0.28",
    "openai>=1.0",
    "google-genai>=1.0",
    "mistralai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
