[project]
name = "ci-core"
version = "0.1.0"
description = "Shared library for CI tools"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.14",
    "structlog>=26.1.0",
    "starlette>=1.3.1",
    # ci_core.llm — the shared streaming LLM call layer. Deliberately built on
    # requests + raw SSE rather than the per-provider SDKs: one transport, one
    # set of timeout/encoding/error-body semantics across all six providers.
    "requests>=2.31.0,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# Vertex AI backend for the Gemini adapter (google.auth token flow).
# Not needed when using Gemini via AI Studio (API-key auth).
vertex = ["google-auth>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
