[project]
name = "ci-core"
version = "0.1.0"
description = "Shared library for CI tools"
requires-python = ">=3.10"
# Runtime dependencies of the modules that actually run today. The
# persistence/settings/logging cluster (ci_core.config, .db, .models, .logging)
# moved to the [persistence] extra below — see audit finding 13.
dependencies = [
    # ci_core.llm — the shared LLM call layer. litellm replaces the six
    # hand-rolled provider adapters and the raw-SSE transport underneath them:
    # one call shape, one set of error classes, and provider extras
    # (Perplexity citations, Gemini grounding, cached tokens) preserved as
    # response fields. See docs/LITELLM.md for what it does and does not carry.
    "litellm>=1.96.2,<2.0",
    # Still used by ci_core.extract and ci_core.http (link checking), and by
    # redact.capture_error_body's requests.HTTPError handling.
    "requests>=2.31.0,<3.0",
    "pyyaml>=6.0,<7.0",
    # ci_core.extract — text extraction from PDF citation sources. Many of the
    # primary documents this pipeline verifies against (ICNIRP guidelines, NIOSH
    # reports, EPA rules) are PDFs, so this is required rather than an extra:
    # pypdf is pure Python with no compiled dependencies, and without it every
    # PDF source degrades to unverifiable.
    "pypdf>=4.0",
    # Main-content extraction. Previously an optional extra of ci-article-review
    # (--url mode fell back to a heuristic parser when it was absent), but
    # citation verification now depends on extraction quality for correctness,
    # not just for output polish: on pages with no <article>/<main> the built-in
    # fallback returns nav and footer chrome, and the verifier then reports that
    # a source does not support a claim it was never actually shown. Measured on
    # the failing citation set, trafilatura recovers real body text (e.g. EPA
    # Green Book county tables) where the fallback returns menus. The fallback
    # stays as a safety net.
    "trafilatura>=1.6",
]

[project.optional-dependencies]
# Browser TLS fingerprint for citation links behind Cloudflare.
# Optional: ci_core.http.impersonating_get degrades to None without it.
unblock = ["curl_cffi>=0.7"]
# ci_core.config / .db / .models / .logging. Implemented and tested, but with no
# production consumer — nothing outside ci-core's own tests and alembic/env.py
# imports them (see the README). They were hard dependencies of ci-core, which
# both application packages depend on, so every user installed an async
# PostgreSQL driver and an ASGI web framework for a CLI tool: asyncpg builds a C
# extension and is the most likely single point of install failure on Windows,
# and ci_core.logging imports starlette HTTP middleware for a tool that never
# serves HTTP.
#
# Install with:  uv sync --extra persistence
persistence = [
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.14",
    "structlog>=26.1.0",
    "starlette>=1.3.1",
]

# Vertex AI backend for the Gemini adapter (google.auth token flow).
# Not needed when using Gemini via AI Studio (API-key auth).
vertex = ["google-auth>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Duplicated from the root pyproject.toml, which is the inifile for the
# repo-wide `pytest packages/` run. This one is what pytest reads when the
# package's own tests are run directly, and the `slow` test lives here.
markers = [
    "slow: inherently wall-clock-bound; deselect with -m 'not slow'",
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
