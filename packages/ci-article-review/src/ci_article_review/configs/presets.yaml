# Cost presets — controls model selection, reasoning depth, and thoroughness as a bundle.
# Edit this file to update model names when providers release new versions.
# See docs/CONFIGURATION.md for full documentation.
#
# Behavior when cost_preset is set in user.yaml:
#   - Sets thoroughness (unless user also set thoroughness: explicitly).
#   - Overrides model name and reasoning flags for each configured provider.
#   - Preserves infrastructure keys: provider, project, location, credentials_file,
#     endpoint, deployment, api_version, prompts, timeout_seconds.
#   - Skips providers with no API key or no models: entry in user.yaml.
#   - Respects enabled: false set by the user — disabled models stay disabled.
#
# Estimated per-article costs assume a 1,500-word article (~4,000 in / ~2,000 out
# tokens per call). Reasoning adds latency and token overhead.
#
#   economy  : ~$0.04 – $0.10   (sanity check, no reasoning)
#   standard : ~$0.10 – $0.40   (solid, no reasoning overhead)
#   balanced : ~$0.50 – $1.50   (light reasoning on key models, thorough coverage)
#   thorough : ~$1.00 – $2.50   (deep reasoning, thorough coverage)
#   maximum  : ~$2.50 – $5.00   (all flagship models, all domains, max reasoning)
#
# Mistral note: mistral-medium-3-5 only accepts reasoning_effort "high" or "none".
#   "low" and "medium" return 400. Standard models do not support reasoning_effort at all.
# Grok note: reasoning is model-selection based. Use grok-4.20-0309-reasoning for CoT;
#   reasoning_effort is not a supported Grok API parameter.
#
# stream_read_timeout note: the review adapters stream (SSE); the socket read
# timeout is normally a small constant "max gap between chunks" (see
# adapters/review/streaming.py), NOT the total generation budget. High/xhigh
# reasoning effort can produce a long SILENT period — zero bytes on the wire,
# not even a keep-alive — while the model reasons before it starts emitting
# visible output.
#
# OpenAI: originally hit this hard — gpt-5.5 at xhigh failed 5/5 calls at ~121s
# with 0 output tokens against the default 120s read-gap under Chat Completions,
# which carries no signal at all during the reasoning phase. Fixed by migrating
# the adapter's primary path to the Responses API with reasoning.summary
# enabled (adapters/review/openai.py): response.reasoning_summary_text.delta
# events stream real bytes DURING the silent phase. Live-verified (2 xhigh
# calls, no override, default 120s read-gap): reasoning-summary deltas start
# ~2-6s in and recur throughout, with a worst observed gap of ~8s — no longer
# anywhere near the 120s default, so no per-model override is needed for
# openai here anymore.
#
# Mistral was NOT migrated (still Chat Completions, no reasoning-summary
# equivalent available) and keeps its stopgap bump: mistral-medium-3-5 high
# effort saw a marginal timeout in the wild (124s vs the 120s default).

economy:
  thoroughness: standard
  models:
    openai:
      model: gpt-5.4-mini
    gemini:
      model: gemini-2.5-flash
    mistral:
      model: mistral-small-latest
    perplexity:
      model: sonar
    grok:
      enabled: false
    claude:
      enabled: false

standard:
  thoroughness: standard
  models:
    openai:
      model: gpt-5.4
    gemini:
      model: gemini-2.5-flash
    mistral:
      model: mistral-large-latest
    perplexity:
      model: sonar-pro
    grok:
      model: grok-4.3
    claude:
      model: claude-haiku-4-5-20251001

balanced:
  thoroughness: thorough
  models:
    openai:
      model: gpt-5.4
      reasoning_effort: low
    gemini:
      model: gemini-2.5-flash
    mistral:
      model: mistral-medium-3-5
      # No reasoning_effort at balanced — mistral-medium-3-5 only accepts "high" or "none"
    perplexity:
      model: sonar-reasoning-pro
    grok:
      model: grok-4.20-0309-reasoning
    claude:
      model: claude-sonnet-4-6
      effort: medium

thorough:
  thoroughness: thorough
  models:
    openai:
      model: gpt-5.4
      reasoning_effort: high
      # No stream_read_timeout override — Responses API + reasoning.summary
      # keeps the default 120s read-gap safe (see the note above).
    gemini:
      model: gemini-2.5-pro
    mistral:
      model: mistral-medium-3-5
      reasoning_effort: high
      stream_read_timeout: 200   # not migrated — see the Mistral note above
    perplexity:
      model: sonar-reasoning-pro
      stream_read_timeout: 350   # 280 was still marginal — a later run hit 282.01s
                                  # outright (originally bumped from the 160s default
                                  # after 2 calls failed at ~162s). Raised again for
                                  # real headroom instead of chasing the edge.
    grok:
      model: grok-4.20-0309-reasoning
    claude:
      model: claude-opus-4-8
      effort: high

maximum:
  thoroughness: maximum
  models:
    openai:
      model: gpt-5.5
      reasoning_effort: xhigh
      # No stream_read_timeout override — live-verified against xhigh (see the
      # note above); Responses API reasoning.summary deltas keep the socket
      # active well inside the 120s default.
    gemini:
      model: gemini-2.5-pro
      thinking_budget: 16000
      # gemini-2.5-pro confirmed available on Vertex AI; gemini-3.x returns 404 there
      stream_read_timeout: 260   # grounding (160s default) + thinking_budget 16000 stacks
                                  # extra silent time on top of search latency; observed a
                                  # real timeout at 205.78s on a maximum-preset Vertex AI
                                  # call (completeness domain, 73786 chars) — the "gemini's
                                  # 160s default has held so far" note on the thorough tier's
                                  # perplexity entry no longer applies once thinking_budget
                                  # is added on top of grounding.
    mistral:
      model: mistral-medium-3-5
      reasoning_effort: high
      stream_read_timeout: 200   # not migrated — see the Mistral note above
    perplexity:
      model: sonar-reasoning-pro
      stream_read_timeout: 350   # see the thorough tier's note above
    grok:
      model: grok-4.20-0309-reasoning
    claude:
      model: claude-opus-4-8
      effort: high
