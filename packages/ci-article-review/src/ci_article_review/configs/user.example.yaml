# API keys -- copy to user.yaml and fill in; never commit user.yaml
api_keys:
  # Required
  openai:
    api_key: your_key_here
  gemini:
    api_key: your_key_here    # omit when using provider: vertex_ai
  mistral:
    api_key: your_key_here

  # Optional — adds a second search-grounded fact-check pass (recommended)
  perplexity:
    api_key: your_key_here

  # Optional — adds a Grok red team pass when present (free tier available)
  grok:
    api_key: your_key_here

  # Optional — adds a Claude argument integrity pass when present
  claude:
    api_key: your_key_here

  # Optional — set grammar_pass: false in pipeline below to skip entirely
  languagetool:
    username: your_email@example.com
    api_key: your_key_here

  # Optional — authenticates Wayback Machine "Save Page Now" submissions for
  # resolved citations that aren't archived yet (get a key pair at
  # https://archive.org/account/s3.php). Without it, submission still works
  # via archive.org's unauthenticated trigger endpoint, just with tighter
  # rate limits.
  archive_org:
    access_key: your_access_key_here
    secret_key: your_secret_key_here


# Model configuration — two forms are accepted:
#
#   Simple form (default):
#     Specify a model name as a plain string.  Uses the provider's public API
#     with your API key above.  This is the right starting point.
#
#   Extended form (provider switching or per-model flags):
#     Specify a dict with provider, model, and any provider-specific fields.
#     Use this to switch to a reserved-capacity tier (Vertex AI, Azure OpenAI),
#     enable web search, restrict which prompts a model runs, or disable a
#     model without removing its API key.  Simple-form entries are unaffected —
#     you can mix forms.
#
# Current model IDs (June 2026):
#   OpenAI:      gpt-5.5 ($5/$30 /MTok), gpt-5.4 ($2.50/$15), gpt-5.4-mini ($0.75/$4.50)
#              o4-mini reasoning ($1.10/$4.40), o3 reasoning ($10/$40)
#   Gemini:      gemini-2.5-pro ($1.25/$10), gemini-2.5-flash ($0.30/$2.50), gemini-2.5-flash-lite ($0.10/$0.40)
#              Note: gemini-3.5-flash does NOT exist in Vertex AI as of June 2026.
#   Mistral:     mistral-large-latest (~$3/$9), mistral-small-latest (~$0.10/$0.30)
#              magistral-medium-latest (native thinking), magistral-small-latest
#              Note: reasoning_effort is NOT supported on any Mistral model (API rejects it).
#              Magistral models think automatically — no parameter needed.
#   Perplexity:  sonar-reasoning-pro, sonar-pro, sonar, sonar-deep-research
#   Grok:        grok-4.3 ($1.25/$2.50), grok-4.20-0309-reasoning ($1.25/$2.50, same price)
#   Claude:      claude-opus-4-8 ($5/$25), claude-sonnet-4-6 ($3/$15), claude-haiku-4-5-20251001 ($1/$5)
#
# Simple form (default):
models:
  openai: gpt-5.4
  gemini: gemini-2.5-flash
  mistral: mistral-large-latest
  perplexity: sonar-reasoning-pro
  grok: grok-4.3
  claude: claude-opus-4-8

# To disable a model without removing its API key, use the extended form:
#
#  grok:
#    enabled: false
#    model: grok-4.3
#
#  claude:
#    enabled: false
#    model: claude-opus-4-8

# To restrict which prompt domains a model runs (overrides thoroughness preset):
#
#  perplexity:
#    model: sonar-reasoning-pro
#    prompts: [fact_check]   # only run this model for fact-check; skip other domains

# Per-model timeout and reasoning controls (extended form):
#
# TIMEOUTS ARE AUTOMATIC. By default the pipeline sizes each model's timeout from
# the draft length, the model, and the reasoning effort using the sliding-scale
# model in configs/timeouts.yaml — you do NOT need to set timeout_seconds.
# Set timeout_seconds on a model only to OVERRIDE the formula for that model.
#
# OpenAI — reasoning.effort: none | low | medium | high | xhigh
# Supported on gpt-5.x models.  Default is "medium" on gpt-5.5.
#
#  openai:
#    model: gpt-5.4
#    reasoning_effort: medium   # "none" | "low" | "medium" | "high" | "xhigh"
#    timeout_seconds: 300
#
# Claude — thinking mode depends on model generation:
#
#   Adaptive thinking (claude-opus-4-8, claude-opus-4-7, claude-fable-5, claude-sonnet-4-6):
#     Always on — no thinking_budget needed.  Control depth via effort parameter.
#     Sonnet 4.6 uses the adaptive path; extended thinking is deprecated for it.
#
#   Extended thinking (claude-haiku-4-5-20251001 and earlier):
#     Opt-in via thinking_budget.  Beta header is added automatically.
#     Do NOT use thinking_budget on Opus 4.8+ or Sonnet 4.6 — use effort instead.
#
#  claude:
#    model: claude-opus-4-8
#    effort: high               # "low" | "medium" | "high" — adaptive thinking depth
#    timeout_seconds: 360
#
#  claude:
#    model: claude-sonnet-4-6
#    effort: medium             # adaptive thinking (recommended); do NOT use thinking_budget
#    timeout_seconds: 360
#
#  claude:
#    model: claude-haiku-4-5-20251001
#    thinking_budget: 5000      # extended thinking; beta header auto-added
#    timeout_seconds: 360
#
# Gemini — thinking token budget (all models support this)
#  gemini:
#    model: gemini-2.5-flash
#    thinking_budget: 8192      # 0 = disable thinking; omit = dynamic default
#    timeout_seconds: 180
#
# Grok — reasoning is model-selection based. Use the reasoning variant for CoT;
# reasoning_effort is not a supported Grok parameter.
#  grok: grok-4.20-0309-reasoning      # CoT variant (same price as grok-4.3)
#
# Mistral — only mistral-medium-3-5 supports reasoning_effort, and only "high"/"none".
# (magistral-medium-latest is deprecated; mistral-medium-3-5-latest does not exist.)
#  mistral:
#    model: mistral-medium-3-5
#    reasoning_effort: high            # "high" or "none" only — "low"/"medium" error


# Extended form examples — replace the simple entries above with these to
# switch providers.  Delete or comment out the simple entry for the same key.
#
# Vertex AI (Gemini) — eliminates AI Studio capacity 503s.
# Requires: pip install google-auth
# Auth: set credentials_file to a service-account JSON, or omit to use
#        Application Default Credentials (gcloud auth application-default login).
#
#  gemini:
#    provider: vertex_ai
#    model: gemini-2.5-flash
#    project: my-gcp-project        # GCP project ID
#    location: us-central1          # Vertex AI region
#    # credentials_file: C:\Users\you\keys\my-project.json   # omit = ADC
#
# OpenAI with live web search (OpenAI Responses API):
#
#  openai:
#    model: gpt-5.4
#    web_search: [fact_check]   # only these domains search; `true` means all five
#                               # (search bills per search, and only fact_check
#                               #  has any use for a live-fetched source)
#
# Azure OpenAI — data residency, SOC2, provisioned throughput.
# The api_key above should be your Azure resource key (not an OpenAI key).
#
#  openai:
#    provider: azure
#    model: gpt-5.4                 # informational label only
#    endpoint: https://my-resource.openai.azure.com
#    deployment: my-gpt5-deployment
#    api_version: "2024-02-01"      # optional; defaults to 2024-02-01
#
# Azure AI (Mistral serverless) — same auth format as La Plateforme.
# Store your Azure endpoint key in api_keys.mistral.api_key above.
#
#  mistral:
#    provider: azure
#    model: mistral-large-latest    # informational label only
#    endpoint: https://Mistral-Large-abc.eastus2.inference.ai.azure.com


# Pipeline behavior
pipeline:
  grammar_pass: true            # set false to skip LanguageTool entirely
  parallel_review_calls: true

  # Which model you draft with, if you draft with one. That model is excluded
  # from voice_style, because ai_speak.txt asks the reviewer to flag the exact
  # phrasing habits that are its own defaults, and it under-reports them.
  # A `Drafted with:` line in the handoff overrides this for a single article.
  # drafting_model: claude


  retry_on_failure: true
  retry_delay_seconds: 10
  abort_if_all_provider_calls_fail: false
  task_timeout_seconds: 1100   # absolute ceiling for the sliding-scale timeout model
                                # (configs/timeouts.yaml); per-model timeouts clamp to this − 15

  # Newer-model check.  The run report always reads the model-discovery cache
  # that `uv run ci-discover` writes, so running that command occasionally is
  # enough to have the report name any model newer than the one a run used.
  #
  # Setting this true additionally lets the run itself refresh that cache when
  # it is older than live_model_check_max_age_hours — one models-list request
  # per provider, at most once per window.  Off by default because it is the
  # only part that adds latency and a network dependency to a run.
  #
  # Advisory either way: a provider that cannot be reached is reported as
  # unchecked rather than as "up to date", and nothing here can fail a run.
  # --offline never queries regardless of this setting.
  # live_model_check: true
  # live_model_check_max_age_hours: 24

  # Link / archive checks
  link_validation: true             # check HTTP status of every URL in the draft
  wayback_link_check: true          # also query the Wayback Machine for each URL
  wayback_snapshot_stale_days: 180  # snapshots older than this are flagged [STALE]

  # Cost preset — sets model variants, reasoning flags, and thoroughness as a bundle.
  # When set, the preset overrides model names and reasoning flags for all configured
  # providers.  Provider infrastructure settings (vertex_ai, azure, credentials) are
  # preserved.  Use thoroughness: below to override just that part of the preset.
  #
  # Preset    Thoroughness  Reasoning     Est. $/article
  # --------  -----------   -----------   ---------------
  # economy   standard      off           $0.04 - $0.10
  # standard  standard      off           $0.10 - $0.40
  # balanced  thorough      light (low)   $0.50 - $1.50   ← default
  # thorough  thorough      deep          $1.00 - $2.50
  # maximum   maximum       max           $2.50 - $5.00
  #
  # Reasoning presets (balanced+) automatically switch to reasoning-capable models.
  # The exact model/effort per preset lives in configs/presets.yaml; current bundle:
  #   OpenAI  → gpt-5.4 low/high (balanced/thorough), gpt-5.5 xhigh (maximum)
  #   Mistral → mistral-medium-3-5 (reasoning_effort "high" at thorough+; "high"/"none" only)
  #   Grok    → grok-4.20-0309-reasoning (model-selection CoT; no reasoning_effort param)
  #   Gemini  → gemini-2.5-pro (thorough+; gemini-3.x not available in Vertex AI)
  # Standard/economy keep gpt-5.4 and mistral-large (no reasoning).
  #
  # All estimates assume a 1500-word article.  Perplexity and thinking-enabled
  # Claude have higher variance due to reasoning trace token overhead.
  #
  cost_preset: balanced

  # Preset overrides — selectively adjust individual settings from the preset
  # without rebuilding the full config.  Only keys you list are changed; all
  # other preset settings remain in effect.
  #
  # Rules:
  #   - The override applies AFTER the preset, so preset values are the baseline.
  #   - Only providers already configured in models: are affected.
  #   - Keys not mentioned keep the preset's value.
  #   - Set a key to null to neutralize it (e.g., thinking_budget: null disables
  #     extended thinking even if the preset would have enabled it).
  #   - Infrastructure keys (provider, project, credentials_file, etc.) work here
  #     but are usually already correct from your models: section.
  #
  # Examples:
  #
  # Bump OpenAI reasoning from balanced's "low" to "high":
  #
  #   preset_overrides:
  #     openai:
  #       reasoning_effort: high
  #
  # Use opus instead of balanced's sonnet, with max effort:
  #
  #   preset_overrides:
  #     claude:
  #       model: claude-opus-4-8
  #       effort: high
  #       thinking_budget: null   # null out sonnet's extended thinking budget
  #
  # Disable Grok for this run without changing your models: section:
  #
  #   preset_overrides:
  #     grok:
  #       enabled: false
  #
  # Upgrade Gemini to 3.5 Flash with a high thinking budget:
  #
  #   preset_overrides:
  #     gemini:
  #       model: gemini-3.5-flash
  #       thinking_budget: 12000

  # Link validation — check HTTP status of every URL in the article and query
  # the Wayback Machine for each.  Adds a few seconds per article.
  # Set to false to skip entirely.
  link_validation: true
  wayback_link_check: true   # false to skip Wayback checks during link validation

  # Thoroughness — overrides the preset's thoroughness level without changing
  # its model selection or reasoning flags.  Omit to use the preset's default.
  #
  #   standard  — one primary model per domain (lowest cost)
  #               fact_check: gemini
  #               voice_style: openai
  #               completeness: openai
  #               argument_integrity: mistral + claude (if configured)
  #               red_team: mistral + grok (if configured)
  #
  #   thorough  — two or three well-suited models per domain
  #               fact_check: gemini + perplexity (both search-grounded)
  #               voice_style: openai + claude
  #               completeness: openai + mistral
  #               argument_integrity: mistral + claude + openai
  #               red_team: mistral + grok + claude
  #
  #   maximum   — every configured model runs every domain
  #               Domain weights in the ensemble section sort signal from noise.
  #               Best coverage; highest cost (~5x standard).
  #
  # thoroughness: thorough


# Ensemble weighting — controls how much each model's findings count toward
# consensus detection (section 1) and section ordering (sections 2-6).
#
# Weights reflect how well-suited each model is for each domain.  Search-
# grounded models receive a higher weight for fact_check because their claims
# are verifiable against live web sources.
#
# consensus_threshold: weighted sum needed to call a passage consensus.
#   Default 2.0 — two general models (1.0 + 1.0) or one grounding-boosted
#   model (1.5) plus any other (≥0.5) triggers consensus.
#
# lt_weight: partial vote added when LanguageTool also flagged the same
#   passage.  Default 0.5.
#
# Built-in defaults are shown as comments below.  Override only what you
# want to change; omitted keys use the built-in values.
#
# ensemble:
#   consensus_threshold: 2.0
#   lt_weight: 0.5
#
#   # confidence_weights: how much a model's OWN stated confidence damps its
#   # vote. The fact-check prompt asks for high/medium/low on every finding;
#   # by default that value is recorded and displayed but does not affect
#   # weighting, so two models flagging a passage at "low" reach consensus
#   # exactly as if both had said "high".
#   #
#   # Uncomment to make hedging count. Values multiply the model's weight, so
#   # they damp a finding without vetoing it — several models agreeing at "low"
#   # can still reach consensus, which is right, because agreement is evidence
#   # even when each model hedged.
#   #
#   # Note self-reported confidence is not calibrated and is not comparable
#   # across providers, and enabling this changes what lands in Section 1.
#   # Re-check your consensus_threshold after turning it on.
#   #
#   # confidence_weights:
#   #   high: 1.0
#   #   medium: 0.75
#   #   low: 0.5
#   weights:
#     gemini:
#       default: 1.0
#       fact_check: 1.5       # boosted: search-grounded
#     perplexity:
#       default: 1.0
#       fact_check: 1.5       # boosted: search-first model
#     openai:
#       default: 1.0
#       voice_style: 1.2      # well-calibrated for AI-speak and style
#       completeness: 1.2
#     mistral:
#       default: 1.0
#       argument_integrity: 1.2
#       red_team: 1.1
#     grok:
#       default: 1.0
#       red_team: 1.2         # direct, contrarian training useful for attacks
#     claude:
#       default: 1.0
#       argument_integrity: 1.3
#       voice_style: 1.1


# Delta assessment thresholds for re-run recommendation
delta:
  word_change_threshold_pct: 15
  claim_change_triggers_rerun: true
  structure_change_triggers_rerun: true
