[project]
name = "ci-article-review"
version = "0.1.0"
description = "Article review pipeline"
requires-python = ">=3.10"
dependencies = [
    "ci-core",
    "requests>=2.31.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0.0,<2.0",
]

[tool.uv.sources]
ci-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_article_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
