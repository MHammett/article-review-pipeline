[project]
name = "ci-web-intel"
version = "0.1.0"
description = "Web intelligence gathering tools"
requires-python = ">=3.10"
dependencies = [
    "ci-core",
]

[tool.uv.sources]
ci-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_web_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
