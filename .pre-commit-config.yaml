repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.19
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [types-requests, types-PyYAML]
        # CI runs `mypy packages/<pkg>/src`, so scope the hook to the same files.
        # Without this the hook also picks up the three identically-named `tests`
        # packages, and mypy aborts on a duplicate-module error before checking
        # anything at all.
        files: ^packages/[^/]+/src/
