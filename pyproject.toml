[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<9.0",
    "pre-commit>=3.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx2>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "--import-mode=importlib"

# Authoritative mypy config. CI runs `mypy` from the repo root, so this is the
# config mypy actually reads — per-package [tool.mypy] sections are not consulted
# in that invocation. ci-article-review is legacy code with many untyped
# functions and optional/lazy third-party imports (yaml, google.auth,
# trafilatura), so we stay non-strict and ignore missing import stubs.
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
